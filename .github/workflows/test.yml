name: Test

on:
  push:
  pull_request:

jobs:
  test:
    # DPAPI, percorsi Windows ed Edge per i test dell'interfaccia: serve un runner Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-deps -r requirements-ast.txt
      - run: npm test
